<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ops Tasks</title>
<style>body{background:#101923;color:#e9f0f7;font:17px system-ui;max-width:760px;margin:8vh auto;padding:24px}small{color:#82cbb7;letter-spacing:2px}h1{font-size:48px;margin-bottom:8px}p{color:#a6b6c6}form{display:flex;gap:12px;margin:32px 0}input[type=text]{flex:1;min-width:0;padding:15px;background:#1b2938;color:white;border:1px solid #456;border-radius:8px}button{background:#82cbb7;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}li{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid #345}li span{flex:1;overflow-wrap:anywhere}ul{padding:0}#status{min-height:24px}input[type=checkbox]{width:20px;height:20px}li button{background:#283d50;color:#e9f0f7}</style>
<small>DEVOPS ASSESSMENT / POSTGRESQL</small><h1>Ops Tasks</h1><p>A small workspace for the things that keep systems running.</p>
<form id="form"><input id="title" type="text" maxlength="200" placeholder="What needs to get done?" aria-label="Task title" required><button>Add task</button></form>
<p id="status" role="status"></p><ul id="tasks"></ul>
<script>
const status=document.querySelector('#status');
async function api(path='',options={}){const r=await fetch('/api/tasks'+path,{...options,headers:{'Content-Type':'application/json'}});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'Request failed')}return r.status===204?null:r.json()}
function fail(e){status.textContent=e.message}
async function load(){try{const tasks=await api();document.querySelector('#tasks').replaceChildren();status.textContent=tasks.length?`${tasks.length} tasks loaded from PostgreSQL`:'No tasks yet. Add your first task.';for(const t of tasks){const li=document.createElement('li'),check=document.createElement('input'),label=document.createElement('span'),del=document.createElement('button');check.type='checkbox';check.checked=t.completed;check.setAttribute('aria-label','Mark task complete');label.textContent=t.title;if(t.completed)label.style.textDecoration='line-through';check.onchange=async()=>{try{await api('/'+t.id,{method:'PATCH',body:JSON.stringify({completed:check.checked})});await load()}catch(e){check.checked=!check.checked;fail(e)}};del.textContent='Delete';del.onclick=async()=>{try{await api('/'+t.id,{method:'DELETE'});await load()}catch(e){fail(e)}};li.append(check,label,del);document.querySelector('#tasks').append(li)}}catch(e){fail(e)}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{await api('',{method:'POST',body:JSON.stringify({title:document.querySelector('#title').value})});document.querySelector('#title').value='';await load()}catch(e){fail(e)}};load();
</script></html>
